# Builds the plugin and publishes a GitHub Release when a v* tag is pushed.
# The tag must match the version in plugin/.claude-plugin/plugin.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin.json version
        shell: pwsh
        run: |
          $version = (Get-Content plugin/.claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
              Write-Error "Tag $env:GITHUB_REF_NAME does not match plugin.json version $version"
              exit 1
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a suffix (e.g. 0.2.0-rc.1) is a prerelease.
          $extra = if ($env:VERSION -like '*-*') { @('--prerelease') } else { @() }
          gh release create $env:GITHUB_REF_NAME "dist/minivakond-$env:VERSION.plugin" `
              --title "Minivakond $env:VERSION" --generate-notes @extra
