# Publishes a GitHub Release with generated notes when a v* tag is pushed.
# The tag must match the version in plugin/.claude-plugin/plugin.json.
# Users install from the marketplace (main), so the release only records what changed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin.json version
        shell: pwsh
        run: |
          $version = (Get-Content plugin/.claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
              Write-Error "Tag $env:GITHUB_REF_NAME does not match plugin.json version $version"
              exit 1
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a suffix (e.g. 0.2.0-rc.1) is a prerelease.
          # Pass it as --prerelease=<bool>: splatting an array into gh mangles the flag.
          $prerelease = if ($env:VERSION -like '*-*') { 'true' } else { 'false' }
          gh release create $env:GITHUB_REF_NAME `
              --title "Minivakond $env:VERSION" --generate-notes "--prerelease=$prerelease"
