<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riport</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #fbfaf8; --surface: #ffffff; --text: #1f1e1c; --muted: #6b6862; --border: #e6e3dd;
    --s1: #3b6fb6; --s2: #d0743c; --s3: #4f9a6a; --s4: #9a5fb0; --s5: #c4a23a; --s6: #5f8f9f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1918; --surface: #232220; --text: #ecebe8; --muted: #a29f98; --border: #3a3835;
      --s1: #6f9be0; --s2: #e8955f; --s3: #74c08e; --s4: #c08ad6; --s5: #e0c260; --s6: #85b8c8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1918; --surface: #232220; --text: #ecebe8; --muted: #a29f98; --border: #3a3835;
    --s1: #6f9be0; --s2: #e8955f; --s3: #74c08e; --s4: #c08ad6; --s5: #e0c260; --s6: #85b8c8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 32px 0 12px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .text { margin: 0 0 12px; max-width: 75ch; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 13px; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .chart { position: relative; height: 320px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num, th.num { text-align: right; }
  tr.total td { font-weight: 600; border-top: 2px solid var(--border); }
  .assumptions { color: var(--muted); font-size: 14px; }
  .assumptions li { margin: 4px 0; }
  .error { color: #b3261e; white-space: pre-wrap; }
  footer { max-width: 960px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 13px; }
  footer div { border-top: 1px solid var(--border); padding-top: 12px; }
  footer .icon { font-family: ui-monospace, Consolas, monospace; margin-right: 6px; padding: 2px 6px;
                 background: color-mix(in srgb, var(--border) 50%, transparent); border-radius: 4px; }
</style>
</head>
<body>
<main></main>
<footer><div><span class="icon">(˙●˙)</span>Minivakond</div></footer>

<script>
// Built by tools/build_report.ps1, which replaces everything between the DATA markers:
// SPEC is report.json verbatim, RESULTS maps each SQL file name to DuckDB's JSON output.
// Do not edit this file by hand; the sample below only serves to preview the template.
// @@DATA
const SPEC = {
  "title": "Nettó árbevétel régiónként",
  "asOf": "2026-07-31",
  "source": "értékesítési export",
  "kpis": { "sql": "kpis.sql", "items": [
    { "col": "revenue", "label": "Nettó árbevétel", "fmt": "ft" },
    { "col": "share_north", "label": "Észak részaránya", "fmt": "pct" }
  ] },
  "sections": [
    { "heading": "Észak hozza a forgalom közel felét",
      "chart": { "type": "bar", "sql": "by_month.sql", "x": "month", "xFmt": "month", "groupBy": "region",
                 "series": [ { "col": "revenue" } ], "fmt": "ft", "stacked": true } },
    { "heading": "Részletek",
      "table": { "sql": "by_region.sql", "totalRow": true, "columns": [
        { "col": "region", "label": "Régió" },
        { "col": "revenue", "label": "Nettó árbevétel", "fmt": "ft" } ] } }
  ],
  "assumptions": [ "Az árbevétel nettó, a sztornó számlák levonásával (R-001)." ]
};
const RESULTS = {
  "kpis.sql": [{"revenue": 124000000, "share_north": "0.419"}],
  "by_month.sql": [{"month": "2026-06-01", "region": "Észak", "revenue": 26000000}, {"month": "2026-06-01", "region": "Dél", "revenue": 20000000},
                   {"month": "2026-07-01", "region": "Észak", "revenue": 26000000}, {"month": "2026-07-01", "region": "Dél", "revenue": 21000000},
                   {"month": "2026-07-01", "region": "Nyugat", "revenue": 31000000}],
  "by_region.sql": [{"region": "Észak", "revenue": 52000000}, {"region": "Dél", "revenue": 41000000},
                    {"region": "Nyugat", "revenue": 31000000}, {"region": "Összesen", "revenue": 124000000}]
};
// @@END

const LOCALE = "hu-HU";
const nf = (opts) => new Intl.NumberFormat(LOCALE, opts);
const toDate = v => new Date(String(v).slice(0, 10) + "T00:00");
const FORMATS = {
  ft:    v => nf({ maximumFractionDigits: 0 }).format(v) + " Ft",
  eur:   v => nf({ minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v) + " €",
  num:   v => nf({ maximumFractionDigits: 2 }).format(v),
  pct:   v => nf({ style: "percent", maximumFractionDigits: 1 }).format(v),
  date:  v => new Intl.DateTimeFormat(LOCALE, { dateStyle: "medium" }).format(toDate(v)),
  month: v => new Intl.DateTimeFormat(LOCALE, { year: "numeric", month: "short" }).format(toDate(v))
};
// DuckDB emits DECIMAL columns as strings, so numeric formats coerce first.
const NUMERIC = new Set(["ft", "eur", "num", "pct"]);
const fmt = (v, f) => v == null || v === "" ? "" :
  FORMATS[f] ? FORMATS[f](NUMERIC.has(f) ? Number(v) : v) : String(v);
// Compact axis ticks: 52 M Ft, 1,2 Mrd Ft
const compact = v => nf({ notation: "compact", maximumFractionDigits: 1 }).format(v);

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const palette = () => ["--s1","--s2","--s3","--s4","--s5","--s6"].map(css);
const rows = sql => {
  if (!RESULTS[sql]) throw new Error("Nincs adat ehhez: " + sql);
  return RESULTS[sql];
};
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

function renderKpis(k) {
  const r = rows(k.sql)[0] || {};
  const box = el("section", "kpis");
  for (const item of k.items) {
    const tile = el("div", "kpi");
    tile.append(el("div", "label", item.label), el("div", "value", fmt(r[item.col], item.fmt)));
    const d = item.delta;
    const delta = typeof d === "string" ? d :
      d ? [fmt(r[d.col], d.fmt), d.text].filter(Boolean).join(" ") : "";
    if (delta) tile.append(el("div", "delta", delta));
    box.append(tile);
  }
  return box;
}

function renderTable(t) {
  const data = rows(t.sql);
  const cols = t.columns || Object.keys(data[0] || {}).map(col => ({ col, label: col }));
  const cls = c => NUMERIC.has(c.fmt) ? "num" : "";
  const table = el("table");
  const head = table.createTHead().insertRow();
  cols.forEach(c => head.append(el("th", cls(c), c.label)));
  const body = table.createTBody();
  data.forEach((r, i) => {
    const tr = body.insertRow();
    if (t.totalRow && i === data.length - 1) tr.className = "total";
    cols.forEach(c => tr.append(el("td", cls(c), fmt(r[c.col], c.fmt))));
  });
  const wrap = el("div", "card table-wrap");
  wrap.append(table);
  return wrap;
}

// Wide rows: one series per entry in `series`. Long rows (`groupBy`): one series per group value.
function chartData(spec) {
  const data = rows(spec.sql);
  const num = v => v == null ? null : Number(v);
  if (spec.groupBy) {
    const y = spec.series[0];
    const labels = [...new Set(data.map(r => r[spec.x]))];
    const groups = [...new Set(data.map(r => r[spec.groupBy]))];
    return { labels, sets: groups.map(g => ({ ...y, name: g == null ? "(nincs megadva)" : String(g),
      values: labels.map(x => num(data.find(r => r[spec.x] === x && r[spec.groupBy] === g)?.[y.col])) })) };
  }
  return { labels: data.map(r => r[spec.x]),
           sets: spec.series.map(s => ({ ...s, values: data.map(r => num(r[s.col])) })) };
}

function renderChart({ canvas, spec }) {
  const colors = palette();
  const { labels, sets } = chartData(spec);
  const doughnut = spec.type === "doughnut";
  const horizontal = !!spec.horizontal && !doughnut;
  const stacked = !!spec.stacked;
  const fmtOf = s => (s.axis === "y2" && spec.fmt2) || spec.fmt || "num";
  const tick = f => f === "pct" ? v => FORMATS.pct(v) :
    v => compact(v) + (f === "ft" ? " Ft" : f === "eur" ? " €" : "");
  canvas.parentElement.style.height = horizontal ? Math.max(240, labels.length * 28 + 60) + "px" : "";

  Chart.defaults.color = css("--muted");
  Chart.defaults.borderColor = css("--border");
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;

  const zero = spec.beginAtZero !== false;
  const scales = doughnut ? {} : {
    [horizontal ? "y" : "x"]: { stacked, grid: { display: false } },
    [horizontal ? "x" : "y"]: { stacked, beginAtZero: zero, ticks: { callback: tick(spec.fmt) } }
  };
  if (!doughnut && !horizontal && sets.some(s => s.axis === "y2")) {
    scales.y2 = { position: "right", beginAtZero: zero, grid: { drawOnChartArea: false },
                  ticks: { callback: tick(spec.fmt2 || spec.fmt) } };
  }

  return new Chart(canvas, {
    type: doughnut ? "doughnut" : spec.type,
    data: {
      labels: labels.map(l => fmt(l, spec.xFmt)),
      datasets: sets.map((s, i) => {
        const c = colors[i % colors.length];
        const type = doughnut ? "doughnut" : s.type || spec.type;
        return {
          type, label: s.name, data: s.values,
          ...(s.axis === "y2" && !horizontal ? { yAxisID: "y2" } : {}),
          backgroundColor: doughnut ? colors : c,
          borderColor: doughnut ? css("--surface") : c,
          borderWidth: type === "line" ? 2 : 1, tension: 0.25, pointRadius: 2,
          order: type === "line" ? 0 : 1
        };
      })
    },
    options: {
      locale: LOCALE,
      indexAxis: horizontal ? "y" : "x",
      maintainAspectRatio: false,
      plugins: {
        legend: { display: sets.length > 1 || doughnut },
        tooltip: { callbacks: { label: c =>
          `${doughnut ? c.label : c.dataset.label}: ${fmt(c.raw, fmtOf(sets[c.datasetIndex]))}` } }
      },
      scales
    }
  });
}

const main = document.querySelector("main");
const charts = [];
try {
  document.title = SPEC.title;
  main.append(el("h1", null, SPEC.title));
  const sub = [SPEC.asOf && "Adatok állapota: " + FORMATS.date(SPEC.asOf),
               SPEC.source && "Forrás: " + SPEC.source].filter(Boolean).join(" · ");
  if (sub) main.append(el("p", "sub", sub));
  if (SPEC.kpis?.items?.length) main.append(renderKpis(SPEC.kpis));

  for (const s of SPEC.sections || []) {
    if (s.heading) main.append(el("h2", null, s.heading));
    if (s.text) main.append(el("p", "text", s.text));
    if (s.chart) {
      const card = el("div", "card"), box = el("div", "chart"), canvas = el("canvas");
      box.append(canvas); card.append(box); main.append(card);
      charts.push({ canvas, spec: s.chart });
    }
    if (s.table) main.append(renderTable(s.table));
  }

  if (SPEC.assumptions?.length) {
    main.append(el("h2", null, "Feltételezések"));
    const ul = el("ul", "assumptions");
    SPEC.assumptions.forEach(a => ul.append(el("li", null, a)));
    main.append(ul);
  }
} catch (e) {
  main.append(el("p", "error", "Hiba a riport megjelenítésekor: " + e.message));
}

// Redraw every chart when the colour scheme changes, from the OS or the host page.
let instances = [];
const drawAll = () => {
  instances.forEach(c => c.destroy());
  instances = charts.map(renderChart);
};
drawAll();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawAll);
new MutationObserver(drawAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
</body>
</html>
