<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riport címe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #fbfaf8; --surface: #ffffff; --text: #1f1e1c; --muted: #6b6862; --border: #e6e3dd;
    --s1: #3b6fb6; --s2: #d0743c; --s3: #4f9a6a; --s4: #9a5fb0; --s5: #c4a23a; --s6: #5f8f9f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1918; --surface: #232220; --text: #ecebe8; --muted: #a29f98; --border: #3a3835;
      --s1: #6f9be0; --s2: #e8955f; --s3: #74c08e; --s4: #c08ad6; --s5: #e0c260; --s6: #85b8c8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1918; --surface: #232220; --text: #ecebe8; --muted: #a29f98; --border: #3a3835;
    --s1: #6f9be0; --s2: #e8955f; --s3: #74c08e; --s4: #c08ad6; --s5: #e0c260; --s6: #85b8c8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 32px 0 12px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 13px; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .chart { position: relative; height: 320px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num, th.num { text-align: right; }
  .assumptions { color: var(--muted); font-size: 14px; }
  .assumptions li { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <h1>Riport címe</h1>
  <p class="sub" id="sub"></p>

  <!-- KPI tiles: keep to 2–4 -->
  <section class="kpis" id="kpis"></section>

  <!-- One <h2> + .card per chart -->
  <h2>A diagram címe a fő megállapítást mondja ki</h2>
  <div class="card"><div class="chart"><canvas id="chart1"></canvas></div></div>

  <h2>Részletek</h2>
  <div class="card table-wrap"><table id="table1"></table></div>

  <h2>Feltételezések</h2>
  <ul class="assumptions" id="assumptions"></ul>
</main>

<script>
// ---- Fill in from query results. Aggregates only. All text in Hungarian. ----
// Numbers stay raw (124000000, not "124 000 000 Ft"); `fmt` picks the display:
//   "ft" | "eur" | "num" | "pct" (0.125 -> 12,5%) | "date" ("2026-10-03")
const DATA = {
  asOf: "2026-10-03",
  source: "értékesítési export",
  kpis: [ { label: "Nettó árbevétel", value: 124000000, fmt: "ft", delta: "+8,2% az előző negyedévhez képest" } ],
  chart1: {
    type: "bar",                       // bar | line | doughnut
    fmt: "ft",
    labels: ["Észak", "Dél", "Nyugat"],
    series: [ { name: "Nettó árbevétel", values: [52000000, 41000000, 31000000] } ]
  },
  table1: {
    columns: [ { key: "region", label: "Régió" }, { key: "revenue", label: "Nettó árbevétel", fmt: "ft" } ],
    rows: [ { region: "Észak", revenue: 52000000 } ]
  },
  assumptions: [ "Az árbevétel nettó, a sztornó számlák levonásával (R-001)." ]
};
// ------------------------------------------------------------------------------

const LOCALE = "hu-HU";
const nf = (opts) => new Intl.NumberFormat(LOCALE, opts);
const FORMATS = {
  ft:   v => nf({ maximumFractionDigits: 0 }).format(v) + " Ft",
  eur:  v => nf({ minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v) + " €",
  num:  v => nf({ maximumFractionDigits: 2 }).format(v),
  pct:  v => nf({ style: "percent", maximumFractionDigits: 1 }).format(v),
  date: v => new Intl.DateTimeFormat(LOCALE, { dateStyle: "medium" }).format(new Date(v + "T00:00"))
};
// Compact axis ticks: 52 M Ft, 1,2 Mrd Ft
const compact = v => nf({ notation: "compact", maximumFractionDigits: 1 }).format(v);
const fmt = (v, f) => v == null ? "" : (FORMATS[f] || String)(v);

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const palette = () => ["--s1","--s2","--s3","--s4","--s5","--s6"].map(css);

document.getElementById("sub").textContent =
  `Adatok állapota: ${FORMATS.date(DATA.asOf)} · Forrás: ${DATA.source}`;

document.getElementById("kpis").innerHTML = DATA.kpis.map(k =>
  `<div class="kpi"><div class="label">${k.label}</div><div class="value">${fmt(k.value, k.fmt)}</div>` +
  (k.delta ? `<div class="delta">${k.delta}</div>` : "") + `</div>`).join("");

const t = DATA.table1;
const isNum = c => c.fmt && c.fmt !== "date";
document.getElementById("table1").innerHTML =
  `<thead><tr>${t.columns.map(c => `<th class="${isNum(c) ? "num" : ""}">${c.label}</th>`).join("")}</tr></thead>` +
  `<tbody>${t.rows.map(r => `<tr>${t.columns.map(c =>
    `<td class="${isNum(c) ? "num" : ""}">${c.fmt ? fmt(r[c.key], c.fmt) : (r[c.key] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody>`;

document.getElementById("assumptions").innerHTML = DATA.assumptions.map(a => `<li>${a}</li>`).join("");

function renderChart(id, spec) {
  const colors = palette();
  const suffix = spec.fmt === "ft" ? " Ft" : spec.fmt === "eur" ? " €" : "";
  const tick = spec.fmt === "pct" ? v => FORMATS.pct(v) : v => compact(v) + suffix;
  Chart.defaults.color = css("--muted");
  Chart.defaults.borderColor = css("--border");
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  return new Chart(document.getElementById(id), {
    type: spec.type,
    data: {
      labels: spec.labels,
      datasets: spec.series.map((s, i) => ({
        label: s.name, data: s.values,
        backgroundColor: spec.type === "doughnut" ? colors : colors[i % colors.length],
        borderColor: spec.type === "doughnut" ? css("--surface") : colors[i % colors.length],
        borderWidth: spec.type === "line" ? 2 : 1, tension: 0.25, pointRadius: 2
      }))
    },
    options: {
      locale: LOCALE,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: spec.series.length > 1 || spec.type === "doughnut" },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmt(c.raw, spec.fmt || "num")}` } }
      },
      scales: spec.type === "doughnut" ? {} : { y: { beginAtZero: true, ticks: { callback: tick } } }
    }
  });
}
let charts = [renderChart("chart1", DATA.chart1)];
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  charts.forEach(c => c.destroy());
  charts = [renderChart("chart1", DATA.chart1)];
});
</script>
</body>
</html>
